<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clear Dekha</title>
<script src="https://unpkg.com/peerjs@1.5.0/dist/peerjs.min.js"></script>
<style>
body{background:#000;color:#fff;text-align:center;font-family:sans-serif;margin:0;padding:15px}
.box{background:#111;border:1px solid #222;border-radius:20px;padding:25px;max-width:380px;margin:40px auto}
input{width:90%;padding:16px;border-radius:12px;border:2px solid #00ff00;background:#000;color:#fff;text-align:center;font-size:22px;outline:none}
#linkBox{display:none;margin-top:15px;padding:12px;background:#000;border:1px dashed #00ff00;color:#00ff00;border-radius:12px;word-break:break-all;font-size:13px}
button{width:100%;padding:16px;border-radius:12px;border:none;font-weight:bold;font-size:18px;margin-top:15px;cursor:pointer}
#on{background:#00ff00;color:#000}
#off{background:red;color:#fff;display:none}
#myScreen, #viewScreen{width:100%;height:100%;background:#000;display:none}
#view{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:none;z-index:999}
video{width:100%;height:100%;object-fit:contain}
</style></head><body>

<div id="main">
<h2 style="color:#00ff00">📱 Clear Dekha</h2>
<div class="box" id="sBox">
<input id="code" type="tel" placeholder="কোড ex: 75907">
<div id="linkBox"></div>
<button id="on" onclick="share()">🟢 ONE - ON করুন</button>
<button id="off" onclick="location.reload()">🔴 OFF করুন</button>
<p id="st" style="color:#888">OFF আছে</p>
<video id="myScreen" autoplay muted></video>
</div>
</div>

<div id="view"><video id="viewScreen" autoplay playsinline></video></div>

<script>
const codeEl=document.getElementById('code');
const linkEl=document.getElementById('linkBox');
const myVideo=document.getElementById('myScreen');
const viewVideo=document.getElementById('viewScreen');

codeEl.addEventListener('input',()=>{
 let v=codeEl.value.trim();
 if(v.length<2){linkEl.style.display='none';return;}
 linkEl.style.display='block';
 linkEl.innerText=location.origin+location.pathname+"?id="+v;
});

let peer, screenStream;

function share(){
 let v=codeEl.value.trim();
 if(!v) return alert('কোড লিখেন');
 document.getElementById('on').style.display='none';
 document.getElementById('off').style.display='block';
 document.getElementById('st').innerText='অনুমতি দিন...';
 
 peer=new Peer("clear-"+v);
 
 peer.on('open', async()=>{
  try{
   screenStream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});
   myVideo.srcObject=screenStream;
   myVideo.style.display='block';
   document.getElementById('st').innerText='🔴 LIVE চলছে - লিংক শেয়ার করুন';
   document.getElementById('view').style.display='block';
   document.getElementById('view').style.position='relative';
   document.getElementById('view').style.height='200px';
   document.getElementById('view').appendChild(myVideo);
  }catch(e){alert('Screen Allow দেন ভাই'); location.reload();}
 });

 peer.on('call', call=>{
  call.answer(screenStream);
 });
}

// Viewer - লিংকে চাপ দিলেই ডাইরেক্ট দেখবে, কোন ডাউনলোড না
let p=new URLSearchParams(location.search);
let id=p.get('id');
if(id){
 document.getElementById('sBox').style.display='none';
 document.getElementById('view').style.display='block';
 document.getElementById('view').style.height='100vh';
 document.getElementById('main').innerHTML='<h2 style="color:#00ff00">Connecting...</h2>';
 let viewerPeer=new Peer();
 viewerPeer.on('open',()=>{
  let call=viewerPeer.call("clear-"+id);
  call.on('stream', stream=>{
   viewVideo.srcObject=stream;
   viewVideo.style.display='block';
  });
  call.on('error',()=>{document.getElementById('main').innerHTML='<h3>Sharer এখনো ON করে নাই</h3>';});
 });
}
</script></body></html>
