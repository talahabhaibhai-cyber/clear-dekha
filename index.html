<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clear Dekha</title>
<script src="https://meet.jit.si/external_api.js"></script>
<style>
body{background:#000;color:#fff;font-family:sans-serif;text-align:center;padding:20px;margin:0}
.box{background:#111;border:1px solid #222;border-radius:20px;padding:20px;max-width:400px;margin:20px auto}
input{width:90%;padding:16px;border-radius:12px;border:2px solid #00ff00;background:#000;color:#fff;text-align:center;font-size:20px}
#linkBox{display:none;margin-top:15px;padding:12px;background:#000;border:1px dashed #00ff00;color:#00ff00;border-radius:12px;word-break:break-all;font-size:14px}
button{width:100%;padding:16px;border-radius:12px;border:none;font-weight:bold;font-size:18px;margin-top:12px}
#copyBtn{background:#222;color:#00ff00;border:1px solid #00ff00;display:none}
#onBtn{background:#00ff00;color:#000}
#offBtn{background:#ff0000;color:#fff;display:none}
#view{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:none;z-index:999}
</style>
</head>
<body>
<div id="main">
<h2 style="color:#00ff00">📱 Clear Dekha</h2>
<div class="box">
<p>শুধু নাম্বার বসান</p>
<input id="num" type="tel" placeholder="যেমন 017xxxxxxxx" oninput="makeLink()">
<div id="linkBox"></div>
<button id="copyBtn" onclick="copy()">🔗 লিংক কপি করুন</button>
<button id="onBtn" onclick="start()">🟢 ON করুন (Screen Share)</button>
<button id="offBtn" onclick="location.reload()">🔴 OFF করুন</button>
<p id="st" style="color:#888;margin-top:10px">OFF আছে</p>
</div>
</div>
<div id="view"></div>

<script>
function makeLink(){
let n=document.getElementById('num').value;
if(n.length<5)return;
let link=location.origin+location.pathname+"?id="+n;
document.getElementById('linkBox').style.display='block';
document.getElementById('linkBox').innerText=link;
document.getElementById('copyBtn').style.display='block';
}
function copy(){
navigator.clipboard.writeText(document.getElementById('linkBox').innerText);
alert('লিংক কপি হয়েছে ভাই');
}
let api=null;
function start(){
let n=document.getElementById('num').value;
if(n.length<5){alert('আগে নাম্বার বসান ভাই');return}
let room="clear-"+n;
document.getElementById('view').style.display='block';
document.getElementById('onBtn').style.display='none';
document.getElementById('offBtn').style.display='block';
document.getElementById('st').innerText='🔴 LIVE চলছে';
api=new JitsiMeetExternalAPI("meet.jit.si",{roomName:room,parentNode:document.getElementById('view'),configOverwrite:{prejoinPageEnabled:false,startWithAudioMuted:true}});
api.addEventListener('videoConferenceJoined',()=>{setTimeout(()=>{api.executeCommand('toggleShareScreen')},1000)});
}
// Viewer Side
let p=new URLSearchParams(location.search);
let id=p.get('id');
if(id){
document.getElementById('main').style.display='none';
document.getElementById('view').style.display='block';
document.getElementById('view').style.height='100vh';
new JitsiMeetExternalAPI("meet.jit.si",{roomName:"clear-"+id,parentNode:document.getElementById('view'),configOverwrite:{prejoinPageEnabled:false}});
}
</script>
</body>
</html>
