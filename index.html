<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share Screen</title>
<style>
body{background:#111;color:#fff;text-align:center;font-family:sans-serif;padding:10px}
.box{background:#222;padding:20px;border-radius:15px;max-width:400px;margin:auto}
button{padding:15px 30px;border-radius:30px;border:0;background:#00ff88;font-weight:bold;font-size:18px;cursor:pointer}
#linkBox{display:none;background:#000;padding:15px;border-radius:10px;margin-top:15px}
video{width:100%;border-radius:10px;background:#000}
</style>
</head>
<body>
<div class="box">
<h2>🔴 Screen Share</h2>
<p id="live" style="display:none;color:red">● LIVE চলছে</p>
<video id="local" autoplay muted></video><br><br>
<button id="btn">ON - Share Start</button>
<div id="linkBox">
<p>এই লিংকটি কাস্টমারকে দাও:</p>
<b id="link" style="color:#00ff88;word-break:break-all"></b><br><br>
<button onclick="copyLink()" style="background:#fff;font-size:14px;padding:8px 15px">Copy Link</button>
</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let stream, roomId, pcs = {};
const btn = document.getElementById('btn');
const video = document.getElementById('local');

btn.onclick = async () => {
  if(btn.innerText.includes('ON')){
    roomId = Math.random().toString(36).substring(2, 7);
    stream = await navigator.mediaDevices.getDisplayMedia({video:true, audio:true});
    video.srcObject = stream;
    socket.emit('join-room', roomId);
    let shareUrl = location.origin + '/view.html?room=' + roomId;
    document.getElementById('link').innerText = shareUrl;
    document.getElementById('linkBox').style.display = 'block';
    document.getElementById('live').style.display = 'block';
    btn.innerText = 'OFF - Stop';
    btn.style.background = '#ff4444';

    socket.on('new-viewer', async (viewerId) => {
      const pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
      pcs[viewerId] = pc;
      stream.getTracks().forEach(track => pc.addTrack(track, stream));
      pc.onicecandidate = e => {
        if(e.candidate) socket.emit('ice-candidate', {roomId, viewerId, candidate: e.candidate});
      }
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.emit('offer', {roomId, viewerId, offer});
    });

    socket.on('answer', data => {
      pcs[data.viewerId]?.setRemoteDescription(data.answer);
    });

    socket.on('ice-candidate', data => {
      pcs[data.viewerId]?.addIceCandidate(data.candidate);
    });

  } else {
    location.reload();
  }
};

function copyLink(){
  navigator.clipboard.writeText(document.getElementById('link').innerText);
  alert('লিংক কপি হয়েছে!');
}
</script>
</body>
</html>
