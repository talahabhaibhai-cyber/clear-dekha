<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clear Dekha - Live Screen</title>
<style>
body{margin:0;background:#0a0a0a;color:white;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:15px}
.box{background:#1e1e1e;width:100%;max-width:400px;border-radius:20px;padding:25px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.6)}
h2{margin:0 0 5px 0}
input{width:90%;padding:14px;margin-top:10px;border-radius:10px;border:none;background:#2c2c2c;color:white;font-size:16px;text-align:center}
button{width:95%;padding:15px;margin-top:12px;border:none;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer}
#hostBtn{background:#00d084;color:white}
#joinBtn{background:#2d6aff;color:white}
#stopBtn{background:#ff3c3c;color:white;display:none}
#status{background:#2a2a2a;padding:12px;border-radius:10px;margin-top:15px;font-weight:bold}
#linkArea{display:none;background:#111;padding:15px;border-radius:12px;margin-top:15px;word-break:break-all}
#video{width:100%;margin-top:15px;border-radius:12px;background:black;display:none}
small{opacity:0.6}
</style>
</head>
<body>
<div class="box">
<h2>Clear Dekha</h2>
<small>লাইভ স্ক্রিন শেয়ার</small>

<input id="roomInput" placeholder="রুম নাম্বার লিখুন (যেমন 1234)">

<button id="hostBtn" onclick="beHost()">ON - আমি দেখাবো (Host)</button>
<button id="joinBtn" onclick="beViewer()">আমি দেখবো (Viewer)</button>
<button id="stopBtn" onclick="stopAll()">OFF - বন্ধ করুন</button>

<div id="status">Status: OFF</div>

<div id="linkArea">
<p>এই লিংকটি যাকে দিবেন সে আপনার স্ক্রিন দেখতে পারবে:</p>
<b id="liveLink" style="color:#00d084;font-size:18px"></b>
<p><small>লিংক কপি করে WhatsApp / Messenger এ শেয়ার করুন</small></p>
</div>

<div id="jitsiBox" style="width:100%;height:400px;margin-top:15px;display:none;border-radius:12px;overflow:hidden"></div>

</div>

<script src="https://meet.jit.si/external_api.js"></script>
<script>
let api = null;
let roomName = "";

function makeRoom(){
 let r = document.getElementById('roomInput').value.trim();
 if(r===""){
  r = "clear-dekha-"+Math.floor(Math.random()*90000+10000);
 }
 return r;
}

function beHost(){
 roomName = makeRoom();
 document.getElementById('roomInput').value = roomName;
 let link = "https://talahabhaibhai-cyber.github.io/clear-dekha/?room="+roomName;
 document.getElementById('liveLink').innerText = link;
 document.getElementById('linkArea').style.display = "block";
 document.getElementById('jitsiBox').style.display = "block";
 document.getElementById('status').innerText = "🔴 LIVE ON - আপনি দেখাচ্ছেন: "+roomName;
 document.getElementById('hostBtn').style.display="none";
 document.getElementById('joinBtn').style.display="none";
 document.getElementById('stopBtn').style.display="block";

 // Start Jitsi as host with screenshare
 api = new JitsiMeetExternalAPI("meet.jit.si", {
  roomName: roomName,
  parentNode: document.querySelector('#jitsiBox'),
  width: '100%',
  height: 400,
  configOverwrite:{ startWithVideoMuted:false, startScreenSharing:true, prejoinPageEnabled:false },
  interfaceConfigOverwrite:{ SHOW_JITSI_WATERMARK:false }
 });
}

function beViewer(){
 roomName = document.getElementById('roomInput').value.trim();
 if(roomName===""){ alert("ভাই রুম নাম্বার বা লিংকের নাম্বারটা লিখুন"); return; }
 document.getElementById('jitsiBox').style.display = "block";
 document.getElementById('status').innerText = "👀 আপনি দেখছেন: "+roomName;
 document.getElementById('hostBtn').style.display="none";
 document.getElementById('joinBtn').style.display="none";
 document.getElementById('stopBtn').style.display="block";

 api = new JitsiMeetExternalAPI("meet.jit.si", {
  roomName: roomName,
  parentNode: document.querySelector('#jitsiBox'),
  width: '100%',
  height: 400,
  configOverwrite:{ prejoinPageEnabled:false },
  interfaceConfigOverwrite:{ SHOW_JITSI_WATERMARK:false }
 });
}

function stopAll(){
 if(api){ api.dispose(); }
 document.getElementById('jitsiBox').style.display="none";
 document.getElementById('linkArea').style.display="none";
 document.getElementById('status').innerText="Status: OFF";
 document.getElementById('hostBtn').style.display="block";
 document.getElementById('joinBtn').style.display="block";
 document.getElementById('stopBtn').style.display="none";
}

// যদি লিংক দিয়ে কেউ আসে, auto join
window.onload = function(){
 let p = new URLSearchParams(window.location.search);
 let r = p.get('room');
 if(r){
  document.getElementById('roomInput').value = r;
  beViewer();
 }
}
</script>
</body>
</html>
