<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clear Dekha</title><script src="https://meet.jit.si/external_api.js"></script>
<style>body{background:#0a0a0a;color:#fff;text-align:center;font-family:sans-serif;padding:15px;margin:0}
.box{background:#151515;border:1px solid #222;border-radius:20px;padding:25px;max-width:380px;margin:30px auto}
input{width:90%;padding:16px;border-radius:12px;border:2px solid #00ff00;background:#000;color:#fff;text-align:center;font-size:22px;letter-spacing:2px;outline:none}
#linkBox{display:none;margin-top:15px;padding:12px;background:#000;border:1px dashed #00ff00;color:#00ff00;border-radius:12px;word-break:break-all;font-size:13px}
button{width:100%;padding:16px;border-radius:12px;border:none;font-weight:bold;font-size:18px;margin-top:15px;cursor:pointer}
#onBtn{background:#00ff00;color:#000}
#joinBtn{background:#00ff00;color:#000}
#offBtn{background:#ff1a1a;color:#fff;display:none}
#view{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:none;z-index:999}
.small{color:#888;font-size:13px;margin-top:10px}
</style></head><body>

<div id="main">
<h2 style="color:#00ff00">📱 Clear Dekha</h2>
<div class="box" id="shareBox">
<p>আপনার কোড বসান</p>
<input id="codeInput" type="tel" placeholder="যেমন 75907225">
<div id="linkBox"></div>
<button id="onBtn" onclick="startShare()">🟢 ONE - Share ON করুন</button>
<button id="offBtn" onclick="location.reload()">🔴 OFF করুন</button>
<p id="status" class="small">OFF আছে</p>
</div>

<div class="box" id="viewBox" style="display:none">
<p>কোড অটো বসে গেছে</p>
<input id="viewCode" type="tel" readonly>
<button id="joinBtn" onclick="joinView()">👁️ JOIN - Screen দেখুন</button>
<p class="small">JOIN চাপ দিলেই লাইভ দেখতে পারবেন</p>
</div>
</div>

<div id="view"></div>

<script>
const codeInput=document.getElementById('codeInput');
const linkBox=document.getElementById('linkBox');
const shareBox=document.getElementById('shareBox');
const viewBox=document.getElementById('viewBox');
const viewCode=document.getElementById('viewCode');

// লিংক বানানো
codeInput.addEventListener('input',()=>{
 let v=codeInput.value.trim();
 if(v.length<3){linkBox.style.display='none';return;}
 let link=location.origin+location.pathname+"?id="+v;
 linkBox.style.display='block';
 linkBox.innerText=link;
});

function startShare(){
 let v=codeInput.value.trim();
 if(!v){alert('আগে কোড বসান ভাই');return;}
 document.getElementById('view').style.display='block';
 document.getElementById('onBtn').style.display='none';
 document.getElementById('offBtn').style.display='block';
 document.getElementById('status').innerText='🔴 LIVE চলছে - Allow দিন';
 let api=new JitsiMeetExternalAPI("meet.jit.si",{roomName:"clear-"+v,parentNode:document.getElementById('view'),configOverwrite:{prejoinPageEnabled:false}});
 api.addEventListener('videoConferenceJoined',()=>{setTimeout(()=>api.executeCommand('toggleShareScreen'),1000);});
}

function joinView(){
 let v=viewCode.value.trim();
 document.getElementById('view').style.display='block';
 document.getElementById('view').style.height='100vh';
 new JitsiMeetExternalAPI("meet.jit.si",{roomName:"clear-"+v,parentNode:document.getElementById('view'),configOverwrite:{prejoinPageEnabled:false}});
}

// যদি লিংকে id থাকে - অটো কোড বসে যাবে
let params=new URLSearchParams(location.search);
let id=params.get('id');
if(id){
 shareBox.style.display='none';
 viewBox.style.display='block';
 viewCode.value=id;
 document.getElementById('main').querySelector('h2').innerText='📱 Screen দেখুন';
}
</script></body></html>
