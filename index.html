<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clear Dekha</title><script src="https://meet.jit.si/external_api.js"></script>
<style>body{background:#000;color:#fff;text-align:center;font-family:sans-serif;padding:20px} .box{background:#111;border-radius:20px;padding:20px;max-width:380px;margin:auto} input{width:90%;padding:15px;border-radius:12px;border:2px solid #00ff00;background:#000;color:#fff;text-align:center;font-size:20px} #link{margin-top:15px;padding:10px;border:1px dashed #00ff00;color:#00ff00;border-radius:10px;word-break:break-all;display:none} button{width:100%;padding:15px;border-radius:12px;border:none;font-weight:bold;font-size:18px;margin-top:12px} #on{background:#00ff00;color:#000} #off{background:red;color:#fff;display:none} #view{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:none;z-index:999}</style></head><body>
<div id="main"><h2 style="color:#00ff00">📱 Clear Dekha</h2><div class="box">
<input id="num" type="number" placeholder="Number বসান" oninput="make()">
<div id="link"></div>
<button id="on" onclick="go()">🟢 ONE - ON করুন</button>
<button id="off" onclick="location.reload()">🔴 OFF করুন</button>
<p id="st">OFF আছে</p></div></div><div id="view"></div>
<script>
function make(){
 let v=document.getElementById('num').value; if(v.length<3)return;
 let l=location.origin+location.pathname+"?id="+v;
 let el=document.getElementById('link'); el.style.display='block'; el.innerText=l;
}
let api=null;
function go(){
 let v=document.getElementById('num').value; if(!v){alert('Number বসান ভাই');return}
 document.getElementById('view').style.display='block';
 document.getElementById('on').style.display='none';
 document.getElementById('off').style.display='block';
 document.getElementById('st').innerText='Allow দিন...';
 let room="clear-"+v;
 api=new JitsiMeetExternalAPI("meet.jit.si",{roomName:room,parentNode:document.getElementById('view'),configOverwrite:{prejoinPageEnabled:false,startWithAudioMuted:true,startWithVideoMuted:true}});
 api.addEventListener('videoConferenceJoined',()=>{ setTimeout(()=>api.executeCommand('toggleShareScreen'),1000); document.getElementById('st').innerText='🔴 LIVE চলছে'; });
}
let p=new URLSearchParams(location.search); let id=p.get('id');
if(id){ document.getElementById('main').style.display='none'; document.getElementById('view').style.display='block'; document.getElementById('view').style.height='100vh';
 new JitsiMeetExternalAPI("meet.jit.si",{roomName:"clear-"+id,parentNode:document.getElementById('view')}); }
</script></body></html>
