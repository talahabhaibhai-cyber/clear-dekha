<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clear Dekha</title>
<script src='https://meet.jit.si/external_api.js'></script>
<style>
body{background:#0a0a0a;color:#fff;font-family:sans-serif;text-align:center;margin:0;padding:20px}
h1{color:#00ff00}
.box{background:#1a1a1a;padding:25px;border-radius:20px;margin-top:20px}
input{width:90%;padding:16px;font-size:20px;border-radius:10px;text-align:center;border:2px solid #00ff00;background:#000;color:#fff}
#link{margin:15px 0;padding:12px;background:#000;border:1px dashed #00ff00;color:#00ff00;word-break:break-all;display:none;border-radius:10px}
button{width:95%;padding:16px;font-size:18px;font-weight:bold;border-radius:12px;border:none;margin-top:10px}
.on{background:#00ff00;color:#000}
.off{background:#ff0000;color:#fff;display:none}
#view{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:none}
</style>
</head>
<body>
<h1>📱 Clear Dekha</h1>
<div id="main" class="box">
<p>আপনার ID লিখুন</p>
<input id="idInput" type="number" placeholder="যেমন 75907225" oninput="gen()">
<div id="link"></div>
<button class="on" onclick="start()">🟢 ON করুন</button>
<button id="offBtn" class="off" onclick="location.reload()">🔴 OFF করুন</button>
<p id="st">OFF আছে</p>
</div>
<div id="view"></div>

<script>
let api=null;
function gen(){
 let v=document.getElementById('idInput').value;
 if(v.length<3)return;
 let url=location.origin+location.pathname+"?id="+v;
 document.getElementById('link').style.display='block';
 document.getElementById('link').innerText=url;
}
function start(){
 let v=document.getElementById('idInput').value;
 if(!v){alert('আগে ID দিন ভাই');return}
 let room="clear-dekha-"+v;
 document.getElementById('st').innerText="Allow চাপ দিন...";
 api=new JitsiMeetExternalAPI("meet.jit.si",{roomName:room,parentNode:document.getElementById('view'),configOverwrite:{prejoinPageEnabled:false,startWithAudioMuted:true}});
 document.getElementById('view').style.display='block';
 document.getElementById('main').style.display='none';
 api.addEventListener('videoConferenceJoined',()=>{
  setTimeout(()=>api.executeCommand('toggleShareScreen'),1000);
 });
}
// যদি লিংক দিয়ে কেউ ঢুকে ?id= বা ?room= দিয়ে
let p=new URLSearchParams(location.search);
let id=p.get('id')||p.get('room');
if(id){
 let room=id.startsWith('clear-dekha-')?id:'clear-dekha-'+id;
 document.body.innerHTML='<div id="view" style="width:100%;height:100vh"></div>';
 new JitsiMeetExternalAPI("meet.jit.si",{roomName:room,parentNode:document.getElementById('view')});
}
</script>
</body>
</html>
